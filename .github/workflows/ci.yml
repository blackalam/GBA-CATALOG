name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Code & Deployment Scaffolding
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Immutable Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Verify Immutable Checkout HEAD
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid GITHUB_SHA format: '${EXPECTED_SHA}'"
            exit 1
          fi
          ACTUAL_HEAD="$(git rev-parse --verify HEAD)"
          if [ "${ACTUAL_HEAD}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked out HEAD (${ACTUAL_HEAD}) does not match immutable GITHUB_SHA (${EXPECTED_SHA})!"
            exit 1
          fi
          echo "Verified immutable checkout HEAD: ${ACTUAL_HEAD}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run Prototype Verification Suite
        run: |
          node test-site.js

      - name: Run Release Engineering & Scaffolding Tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/test-deployment-scaffolding.sh

      - name: Verify Static Packaging Whitelist
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TEST_ID="ci-build-${GIT_SHA}"
          ./scripts/package-artifact.sh "${TEST_ID}" "${GIT_SHA}"

          TARBALL="dist/gba-static-${TEST_ID}.tar.gz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Release tarball was not created!"
            exit 1
          fi

          if [ ! -f "${TARBALL}.sha256" ]; then
            echo "::error::Release tarball SHA256 checksum file was not created!"
            exit 1
          fi

          echo "Tarball verification:"
          tar -tzf "${TARBALL}"
