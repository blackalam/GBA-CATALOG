name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release ID to restore (from /home/alibhatt/backups/gbafurniture)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gba-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Execute Safe Production Rollback
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Validate Branch & Release ID
        env:
          RELEASE_ID: ${{ github.event.inputs.release_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF:-}" != "refs/heads/master" ]; then
            echo "::error::Rollback workflow must strictly be executed from the 'master' branch. Current ref: ${GITHUB_REF:-}"
            exit 1
          fi
          if [ -z "${RELEASE_ID}" ]; then
            echo "::error::Release ID must not be empty."
            exit 1
          fi
          if [[ ! "${RELEASE_ID}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || [[ "${RELEASE_ID}" == *".."* ]]; then
            echo "::error::Release ID '${RELEASE_ID}' contains invalid characters. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ without '..'"
            exit 1
          fi
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::GITHUB_SHA '${EXPECTED_SHA}' is not a valid 40-character commit SHA."
            exit 1
          fi
          echo "Validated Rollback Release ID: ${RELEASE_ID} on branch 'master' at commit ${EXPECTED_SHA}."

      - name: Checkout Immutable Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Verify Immutable Checkout HEAD
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse --verify HEAD)"
          if [ "${ACTUAL_HEAD}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked out HEAD (${ACTUAL_HEAD}) does not match immutable GITHUB_SHA (${EXPECTED_SHA})!"
            exit 1
          fi
          echo "Verified immutable checkout HEAD: ${ACTUAL_HEAD}"

      - name: Validate Parameters & Configure Secure SSH Access
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://gbafurniture.com' }}
        run: |
          set -euo pipefail

          # Validate SSH_HOST
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Required secret SSH_HOST is missing or empty."
            exit 1
          fi
          if [[ ! "${SSH_HOST}" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::SSH_HOST contains invalid characters."
            exit 1
          fi

          # Validate SSH_USER
          if [ -z "${SSH_USER:-}" ]; then
            echo "::error::Required secret SSH_USER is missing or empty."
            exit 1
          fi
          if [[ ! "${SSH_USER}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]; then
            echo "::error::SSH_USER '${SSH_USER}' is not a valid username format."
            exit 1
          fi

          # Validate SSH_PORT
          if [ -z "${SSH_PORT:-}" ] || [[ ! "${SSH_PORT}" =~ ^[0-9]+$ ]] || [ "${SSH_PORT}" -lt 1 ] || [ "${SSH_PORT}" -gt 65535 ]; then
            echo "::error::SSH_PORT must be a valid integer between 1 and 65535. Given: '${SSH_PORT:-}'"
            exit 1
          fi

          # Validate PRODUCTION_URL
          if [ -z "${PRODUCTION_URL:-}" ] || [[ ! "${PRODUCTION_URL}" =~ ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(/[a-zA-Z0-9._/-]*)?$ ]]; then
            echo "::error::PRODUCTION_URL '${PRODUCTION_URL:-}' is invalid. Must match ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(/[a-zA-Z0-9._/-]*)?$"
            exit 1
          fi

          # Validate SSH_KEY
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Required secret SSH_KEY is missing or empty."
            exit 1
          fi

          # Validate SSH_KNOWN_HOSTS (Mandatory secret)
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Required secret SSH_KNOWN_HOSTS is missing or empty. Pinned host key verification is required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_id
          chmod 600 ~/.ssh/deploy_id

          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "SSH credentials, user '${SSH_USER}', port '${SSH_PORT}', URL '${PRODUCTION_URL}', and known_hosts strictly configured."

      - name: Transfer Rollback Script & Execute
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://gbafurniture.com' }}
          RELEASE_ID: ${{ github.event.inputs.release_id }}
        run: |
          set -euo pipefail

          # Re-validate inputs before remote transport
          [[ "${RELEASE_ID}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] && [[ "${RELEASE_ID}" != *".."* ]]
          [[ "${PRODUCTION_URL}" =~ ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(/[a-zA-Z0-9._/-]*)?$ ]]

          REMOTE_STAGE="/home/alibhatt/.gba-deploy-staging/${RELEASE_ID}"
          SSH_OPTS=(-i ~/.ssh/deploy_id -p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes)
          SCP_OPTS=(-i ~/.ssh/deploy_id -P "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes)

          STAGE_RESERVED=0
          cleanup_remote_stage() {
            local exit_code=$?
            if [ "${STAGE_RESERVED}" -eq 1 ]; then
              ssh "${SSH_OPTS[@]}" -- "${SSH_USER}@${SSH_HOST}" \
                "bash -s -- $(printf '%q ' "${REMOTE_STAGE}" "${RELEASE_ID}")" <<'CLEANEOF' || true
          set -euo pipefail
          REMOTE_STAGE="$1"
          RELEASE_ID="$2"
          if [ ! -L "/home" ] && [ ! -L "/home/alibhatt" ] && [ ! -L "/home/alibhatt/.gba-deploy-staging" ] && [ ! -L "${REMOTE_STAGE}" ] && [ -d "${REMOTE_STAGE}" ]; then
            CANON="$(cd -P -- "${REMOTE_STAGE}" && pwd -P)"
            if [ "${CANON}" = "/home/alibhatt/.gba-deploy-staging/${RELEASE_ID}" ]; then
              rm -rf -- "${CANON}"
            fi
          fi
          CLEANEOF
            fi
            exit ${exit_code}
          }
          trap cleanup_remote_stage EXIT INT TERM HUP

          echo "Securing and reserving remote staging area before upload: ${REMOTE_STAGE}"
          ssh "${SSH_OPTS[@]}" -- "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- $(printf '%q ' "${REMOTE_STAGE}" "${RELEASE_ID}")" <<'EOF'
          set -euo pipefail
          REMOTE_STAGE="$1"
          RELEASE_ID="${2:-$(basename "${REMOTE_STAGE}")}"

          if [ -z "${RELEASE_ID}" ] || [[ ! "${RELEASE_ID}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || [[ "${RELEASE_ID}" == *".."* ]]; then
            echo "CRITICAL ERROR: Invalid RELEASE_ID '${RELEASE_ID}' for remote staging." >&2
            exit 1
          fi

          if [ "${TEST_MODE:-0}" = "1" ] && [ -n "${GBA_STAGE_ROOT_OVERRIDE:-}" ]; then
            STAGE_ROOT="${GBA_STAGE_ROOT_OVERRIDE%/}"
          else
            if [ -n "${GBA_STAGE_ROOT_OVERRIDE:-}" ]; then
              echo "CRITICAL ERROR: GBA_STAGE_ROOT_OVERRIDE is forbidden when TEST_MODE != 1!" >&2
              exit 1
            fi
            STAGE_ROOT="/home/alibhatt/.gba-deploy-staging"
          fi
          EXPECTED_STAGE="${STAGE_ROOT}/${RELEASE_ID}"
          if [ "${REMOTE_STAGE}" != "${EXPECTED_STAGE}" ]; then
            echo "CRITICAL ERROR: REMOTE_STAGE '${REMOTE_STAGE}' does not match expected '${EXPECTED_STAGE}'!" >&2
            exit 1
          fi

          PARENT_DIR="$(dirname "${STAGE_ROOT}")"
          curr=""
          IFS='/' read -r -a anc_parts <<< "${PARENT_DIR}"
          for part in "${anc_parts[@]}"; do
            if [ -z "${part}" ]; then
              continue
            fi
            curr="${curr}/${part}"
            if [ -L "${curr}" ]; then
              if [ "${TEST_MODE:-0}" = "1" ] && [ "$(uname -s)" = "Darwin" ] && [[ "${curr}" =~ ^/(var|tmp|etc)$ ]]; then
                continue
              fi
              echo "CRITICAL ERROR: Remote staging ancestor '${curr}' is a symlink!" >&2
              exit 1
            fi
            if [ ! -d "${curr}" ]; then
              echo "CRITICAL ERROR: Remote staging ancestor '${curr}' does not exist or is not a directory!" >&2
              exit 1
            fi
          done
          if [ "${TEST_MODE:-0}" != "1" ]; then
            for ancestor in "/home" "/home/alibhatt"; do
              if [ -L "${ancestor}" ] || [ ! -d "${ancestor}" ] || [ "$(cd -P -- "${ancestor}" && pwd -P)" != "${ancestor}" ]; then
                echo "CRITICAL ERROR: Remote staging ancestor '${ancestor}' failed canonical directory check!" >&2
                exit 1
              fi
            done
          fi

          if [ -L "${STAGE_ROOT}" ]; then
            echo "CRITICAL ERROR: Remote staging root '${STAGE_ROOT}' is a symlink!" >&2
            exit 1
          fi
          if [ -e "${STAGE_ROOT}" ] && [ ! -d "${STAGE_ROOT}" ]; then
            echo "CRITICAL ERROR: Remote staging root '${STAGE_ROOT}' exists and is not a directory!" >&2
            exit 1
          fi
          if [ ! -d "${STAGE_ROOT}" ]; then
            mkdir -m 700 -- "${STAGE_ROOT}"
          fi
          chmod 700 "${STAGE_ROOT}"
          if [ -L "${STAGE_ROOT}" ] || [ ! -d "${STAGE_ROOT}" ]; then
            echo "CRITICAL ERROR: Remote staging root '${STAGE_ROOT}' failed post-mkdir validation!" >&2
            exit 1
          fi
          CANON_STAGE_ROOT="$(cd -P -- "${STAGE_ROOT}" && pwd -P)"
          EXPECTED_CANON_ROOT="${STAGE_ROOT}"
          if [ "${TEST_MODE:-0}" = "1" ] && [ "$(uname -s)" = "Darwin" ] && [[ "${STAGE_ROOT}" =~ ^/(var|tmp|etc)(/|$) ]]; then
            EXPECTED_CANON_ROOT="/private${STAGE_ROOT}"
          fi
          if [ "${CANON_STAGE_ROOT}" != "${EXPECTED_CANON_ROOT}" ]; then
            echo "CRITICAL ERROR: Remote staging root realpath '${CANON_STAGE_ROOT}' != '${EXPECTED_CANON_ROOT}'!" >&2
            exit 1
          fi

          LOCK_DIR="${GBA_LOCK_OVERRIDE:-/home/alibhatt/.gba-deploy.lock}"
          if [ "${TEST_MODE:-0}" != "1" ]; then
            LOCK_DIR="/home/alibhatt/.gba-deploy.lock"
          fi
          if [ -L "${LOCK_DIR}" ] || [ -L "${LOCK_DIR}.meta" ]; then
            echo "CRITICAL ERROR: Host lock path '${LOCK_DIR}' is a symlink!" >&2
            exit 1
          fi
          if [ -e "${LOCK_DIR}" ] && [ ! -f "${LOCK_DIR}" ]; then
            echo "CRITICAL ERROR: Host lock path '${LOCK_DIR}' exists and is not a regular file!" >&2
            exit 1
          fi
          if [ -f "${LOCK_DIR}" ]; then
            if command -v flock >/dev/null 2>&1; then
              if ! ( exec 9>>"${LOCK_DIR}" && flock -n 9 ); then
                echo "CRITICAL ERROR: Host deployment lock '${LOCK_DIR}' is currently held by an active operation!" >&2
                exit 1
              fi
            elif command -v python3 >/dev/null 2>&1; then
              if ! ( exec 9>>"${LOCK_DIR}" && python3 -c 'import fcntl; fcntl.flock(9, fcntl.LOCK_EX | fcntl.LOCK_NB)' ); then
                echo "CRITICAL ERROR: Host deployment lock '${LOCK_DIR}' is currently held by an active operation!" >&2
                exit 1
              fi
            fi
          fi

          if [ -e "${REMOTE_STAGE}" ] || [ -L "${REMOTE_STAGE}" ]; then
            echo "CRITICAL ERROR: Remote release stage path '${REMOTE_STAGE}' already exists or is a symlink! Refusing predictable staging path." >&2
            exit 1
          fi

          mkdir -m 700 -- "${REMOTE_STAGE}"
          chmod 700 "${REMOTE_STAGE}"

          if [ -L "${REMOTE_STAGE}" ] || [ ! -d "${REMOTE_STAGE}" ]; then
            echo "CRITICAL ERROR: Reserved remote stage '${REMOTE_STAGE}' is not a real directory!" >&2
            exit 1
          fi
          CANON_STAGE="$(cd -P -- "${REMOTE_STAGE}" && pwd -P)"
          EXPECTED_CANON_STAGE="${EXPECTED_CANON_ROOT}/${RELEASE_ID}"
          if [ "${CANON_STAGE}" != "${EXPECTED_CANON_STAGE}" ]; then
            echo "CRITICAL ERROR: Reserved remote stage realpath '${CANON_STAGE}' != '${EXPECTED_CANON_STAGE}'!" >&2
            exit 1
          fi
          if [ "${TEST_MODE:-0}" != "1" ] && command -v realpath >/dev/null 2>&1; then
            REALPATH_STAGE="$(realpath "${REMOTE_STAGE}")"
            if [ "${REALPATH_STAGE}" != "${EXPECTED_STAGE}" ]; then
              echo "CRITICAL ERROR: realpath '${REALPATH_STAGE}' != '${EXPECTED_STAGE}'!" >&2
              exit 1
            fi
          fi
          find_out=""
          find_rc=0
          find_out="$(find "${CANON_STAGE}" -type l -print 2>&1)" || find_rc=$?
          if [ "${find_rc}" -ne 0 ] || [ -n "${find_out}" ]; then
            echo "CRITICAL ERROR: Symlink scan failed or found symlinks in '${CANON_STAGE}'!" >&2
            exit 1
          fi
          EOF
          STAGE_RESERVED=1

          echo "Transferring rollback scripts..."
          scp "${SCP_OPTS[@]}" -- scripts/rollback.sh "${SSH_USER}@${SSH_HOST}:${REMOTE_STAGE}/rollback.sh"
          scp "${SCP_OPTS[@]}" -- scripts/smoke-test.sh "${SSH_USER}@${SSH_HOST}:${REMOTE_STAGE}/smoke-test.sh"

          echo "Executing rollback script on remote host with positional arguments..."
          ssh "${SSH_OPTS[@]}" -- "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- $(printf '%q ' "${REMOTE_STAGE}" "${RELEASE_ID}" "${PRODUCTION_URL}")" <<'EOF'
          set -euo pipefail
          REMOTE_STAGE="$1"
          RELEASE_ID="$2"
          PRODUCTION_URL="$3"
          EXPECTED_STAGE="/home/alibhatt/.gba-deploy-staging/${RELEASE_ID}"
          if [ -L "/home" ] || [ -L "/home/alibhatt" ] || [ -L "/home/alibhatt/.gba-deploy-staging" ] || [ -L "${REMOTE_STAGE}" ] || [ ! -d "${REMOTE_STAGE}" ]; then
            echo "CRITICAL ERROR: Remote stage '${REMOTE_STAGE}' failed pre-execution symlink guard!" >&2
            exit 1
          fi
          CANON_STAGE="$(cd -P -- "${REMOTE_STAGE}" && pwd -P)"
          if [ "${CANON_STAGE}" != "${EXPECTED_STAGE}" ] || [ "${REMOTE_STAGE}" != "${EXPECTED_STAGE}" ]; then
            echo "CRITICAL ERROR: Remote stage realpath '${CANON_STAGE}' != '${EXPECTED_STAGE}'!" >&2
            exit 1
          fi
          find_out=""
          find_rc=0
          find_out="$(find "${CANON_STAGE}" -type l -print 2>&1)" || find_rc=$?
          if [ "${find_rc}" -ne 0 ] || [ -n "${find_out}" ]; then
            echo "CRITICAL ERROR: Symlinks detected inside '${CANON_STAGE}'!" >&2
            exit 1
          fi
          trap 'rm -rf -- "${CANON_STAGE}"' EXIT INT TERM HUP
          chmod +x "${CANON_STAGE}/rollback.sh" "${CANON_STAGE}/smoke-test.sh"
          "${CANON_STAGE}/rollback.sh" "${RELEASE_ID}" "${PRODUCTION_URL}"
          EOF
          STAGE_RESERVED=0

      - name: Rollback Summary
        env:
          RELEASE_ID: ${{ github.event.inputs.release_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Rollback Completed :leftwards_arrow_with_hook:"
            echo "- **Restored Release ID:** \`${RELEASE_ID}\`"
            echo "- **Git SHA:** \`${GIT_SHA}\`"
            echo "- **Branch:** \`master\`"
            echo "- **Environment:** \`production\`"
            echo "- **Docroot:** \`/home/alibhatt/web/gbafurniture.com\`"
            echo "- **Status:** Verified manifest backup hashes, restored docroot files and database from \`/home/alibhatt/backups/gbafurniture/\`, and verified HTTP 200 & content health."
          } >> "${GITHUB_STEP_SUMMARY}"
